openapi: 3.0.3
info:
  title: AI-Chat REST API
  description: API specification for AI-Chat Tauri application backend.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local development server

components:
  schemas:
    Chat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        folderId:
          type: string
          nullable: true
        model:
          type: string
        providerId:
          type: string
        systemPrompt:
          type: string
          nullable: true

    Message:
      type: object
      required:
        - id
        - role
        - content
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        parentId:
          type: string
          nullable: true
        timestamp:
          type: integer
          format: int64
        model:
          type: string
          nullable: true

    AgentMemory:
      type: object
      required:
        - id
        - content
        - category
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        category:
          type: string
          enum: [fact, decision, preference, context, learning]
        sourceChatId:
          type: string
          nullable: true
        isPinned:
          type: boolean
        createdAt:
          type: integer
          format: int64

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

paths:
  /chats:
    get:
      summary: List all chats
      responses:
        '200':
          description: A list of chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
    post:
      summary: Create a new chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                model:
                  type: string
                providerId:
                  type: string
      responses:
        '201':
          description: Chat created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'

  /chats/{chatId}:
    parameters:
      - name: chatId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get chat details by ID
      responses:
        '200':
          description: Detailed chat info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '404':
          description: Chat not found
    delete:
      summary: Delete a chat
      responses:
        '204':
          description: Chat deleted

  /chats/{chatId}/messages:
    get:
      summary: Get messages for a specific chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      summary: Send a new message to the chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                role:
                  type: string
                  default: user
      responses:
        '201':
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /memories:
    get:
      summary: List agent memories
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: query
          in: query
          description: Search query for semantic search
          schema:
            type: string
      responses:
        '200':
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentMemory'
    post:
      summary: Create a new memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
                - category
              properties:
                content:
                  type: string
                category:
                  type: string
                sourceChatId:
                  type: string
      responses:
        '201':
          description: Memory saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMemory'

  /settings:
    get:
      summary: Get application settings
      responses:
        '200':
          description: Current settings
    patch:
      summary: Update application settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Settings updated
