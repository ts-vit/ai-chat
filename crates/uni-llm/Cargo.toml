[package]
name = "uni-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
uni-common = { path = "../uni-common" }
uni-http = { path = "../uni-http" }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
tokio = { version = "1", features = ["time", "macros", "rt"] }
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
