[package]
name = "uni-converter"
version = "0.1.0"
edition = "2021"

[dependencies]
uni-common = { path = "../uni-common" }
uni-python = { path = "../uni-python" }
htmd = "0.5"
pdf-extract = "0.7"
csv = "1"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
