[package]
name = "ai-chat"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.2"
tauri-plugin-shell = "2"
reqwest = { version = "0.13.2", features = ["json", "stream", "multipart", "socks"] }
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3"
futures-util = "0.3.32"
log = "0.4"
env_logger = "0.11"
tokio-util = { version = "0.7", features = ["rt"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.21"
# Embedding + Vector Store
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
tokenizers = "0.19"
ndarray = "0.17"
lancedb = "0.23"
arrow-array = "56"
arrow-schema = "56"
anyhow = "1"
lzma-sys = { version = "*", features = ["static"] }
zip = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tiktoken-rs = "0.6"
cpal = "0.15"
hound = "3.5"
libloading = "0.8"
tts = "0.26"
rodio = "0.22"
regex = "1"
scraper = "0.22"
rand = "0.8"
portable-pty = "0.8"
dirs = "5"
russh = "0.46"
russh-keys = "0.46"
fast-socks5 = "0.9"
async-trait = "0.1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
dunce = "1"
cron = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

