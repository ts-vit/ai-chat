[package]
name = "uni-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP (Model Context Protocol) client for UNI Framework"
license = "MIT"
repository = "https://github.com/ts-vit/ai-chat"
homepage = "https://github.com/ts-vit/ai-chat"
keywords = ["mcp", "model-context-protocol", "json-rpc", "ai", "framework"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
log = "0.4"
