[package]
name = "uni-http"
version = "0.1.0"
edition = "2021"

[dependencies]
uni-common = { path = "../uni-common" }
reqwest = { version = "0.13.2", features = ["json", "stream", "socks"] }
tokio = { version = "1", features = ["time", "macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
