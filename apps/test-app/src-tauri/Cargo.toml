[package]
name = "test-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "test_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "socks"] }

# UNI Framework — core
uni-common = { path = "../../../crates/uni-common" }
uni-settings = { path = "../../../crates/uni-settings" }

# UNI Framework — modules
uni-ssh = { path = "../../../crates/uni-ssh" }
uni-terminal = { path = "../../../crates/uni-terminal" }
uni-http = { path = "../../../crates/uni-http" }
