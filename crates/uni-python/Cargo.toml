[package]
name = "uni-python"
version = "0.1.0"
edition = "2021"

[dependencies]
uni-common = { path = "../uni-common" }
tokio = { version = "1", features = ["process", "io-util", "time", "fs", "macros", "rt", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
which = "7"
regex = "1"
