[package]
name = "ai-chat"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
uni-common = { path = "../../../crates/uni-common" }
uni-http = { path = "../../../crates/uni-http" }
uni-llm = { path = "../../../crates/uni-llm" }
uni-embedding = { path = "../../../crates/uni-embedding" }
uni-search = { path = "../../../crates/uni-search" }
uni-audio = { path = "../../../crates/uni-audio" }
uni-python = { path = "../../../crates/uni-python" }
uni-converter = { path = "../../../crates/uni-converter" }
uni-settings = { path = "../../../crates/uni-settings" }
uni-ssh = { path = "../../../crates/uni-ssh" }
uni-terminal = { path = "../../../crates/uni-terminal" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
reqwest = { version = "0.13.2", features = ["json", "stream", "multipart", "socks"] }
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3"
futures-util = "0.3.32"
log = "0.4"
env_logger = "0.11"
tokio-util = { version = "0.7", features = ["rt"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.21"
# Vector Store
lancedb = "0.23"
arrow-array = "56"
arrow-schema = "56"
anyhow = "1"
zip = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tiktoken-rs = "0.6"
cpal = "0.15"
hound = "3.5"
rodio = "0.22"
regex = "1"
scraper = "0.22"
rand = "0.8"
dirs = "5"
russh = "0.46"
russh-keys = "0.46"
fast-socks5 = "0.9"
async-trait = "0.1"
sha2 = "0.10"
pdf-extract = "0.7"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
dunce = "1"
cron = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

