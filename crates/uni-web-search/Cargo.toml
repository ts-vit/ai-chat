[package]
name = "uni-web-search"
version = "0.1.0"
edition = "2021"
description = "Web search providers and content fetching for UNI Framework"
license = "MIT"

[dependencies]
uni-common = { path = "../uni-common" }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
scraper = "0.22"
regex = "1"
rand = "0.8"
log = "0.4"
